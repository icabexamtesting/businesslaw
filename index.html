, 1994 defines the term \"company\"?","options":["Section 1","Section 2","Section 3","Section 4"],"answer":1,"explanation":"Section 2 of the Act provides definitions for various terms, including \"company.\"","page":3,"originalNumber":2,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to change its name to one that is very similar to an existing company's name. What does the Companies Act, 1994 say about this?","options":["The company can change its name without any restrictions.","The company must obtain written consent from the existing company.","The company must notify the Registrar but does not need consent.","The company cannot change its name to one that is similar to an existing company's name. Busine s s Laws – "],"answer":1,"explanation":"According to the Companies Act, 1994, a company cannot be registered by a name that is identical or nearly resembles an existing company's name unless the existing company gives written consent.","page":60,"originalNumber":1,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the minimum number of members required to form a private company under the Companies Act, 1994?","options":["1","2","3","7"],"answer":1,"explanation":"A private company must have at least two members.","page":3,"originalNumber":3,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A director of a company has a personal interest in a contract being considered by the board. What must the director do according to the Companies Act, 1994?","options":["The director can vote on the contract.","The director must disclose his interest and abstain from voting.","The director can vote if the majority of the board agrees.","The director must resign from the board."],"answer":1,"explanation":"The Companies Act, 1994 requires directors to disclose their interest in any contract with the company and abstain from voting on the matter.","page":61,"originalNumber":2,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the minimum number of members required to form a public company under the Companies Act, 1994?","options":["2","3","5","7"],"answer":3,"explanation":"A public company must have at least seven members.","page":3,"originalNumber":4,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company has not held its annual general meeting (AGM) within the stipulated time. What action can be taken according to the Companies Act, 1994?","options":["The company can be fined.","The company must hold the AGM within the next six months.","The Registrar can call or direct the calling of the AGM.","The company can be dissolved."],"answer":2,"explanation":"If a company fails to hold its AGM within the stipulated time, the Registrar can call or direct the calling of the AGM.","page":61,"originalNumber":3,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"Under the Companies Act, 1994, what is the maximum number of members allowed in a private company?","options":["50","100","150","200 Busine s s Laws – "],"answer":0,"explanation":"A private company cannot have more than fifty members.","page":3,"originalNumber":5,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to issue shares at a discount. What conditions must be met according to the Companies Act, 1994?","options":["The company can issue shares at any discount rate.","The discount must be authorized by a special resolution and sanctioned by the Court.","The company must obtain approval from the Registrar.","The company cannot issue shares at a discount."],"answer":1,"explanation":"The Companies Act, 1994 allows shares to be issued at a discount if it is authorized by a special resolution and sanctioned by the Court.","page":61,"originalNumber":4,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"Which document outlines the internal management of a company?","options":["Memorandum of Association","Articles of Association","Prospectus","Statement in lieu of prospectus"],"answer":1,"explanation":"The Articles of Association contain the regulations for the internal management of the company.","page":4,"originalNumber":6,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company is unable to pay its debts. What can a creditor do according to the Companies Act, 1994?","options":["The creditor can file a lawsuit against the company.","The creditor can apply to the Court for the winding up of the company.","The creditor can seize the company's assets.","The creditor can demand immediate payment from the directors."],"answer":1,"explanation":"If a company is unable to pay its debts, a creditor can apply to the Court for the winding up of the company under the Companies Act, 1994. Busine s s Laws – ","page":61,"originalNumber":5,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the purpose of the Memorandum of Association?","options":["To outline the internal management of the company","To define the company's relationship with the outside world","To provide details of the company's financial status","To list the company's employees"],"answer":1,"explanation":"The Memorandum of Association defines the company's objectives and its relationship with the outside world.","page":4,"originalNumber":7,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Which section of the Companies Act, 1994 deals with the alteration of the Memorandum of Association?","options":["Section 10","Section 12","Section 14","Section 16"],"answer":1,"explanation":"Section 12 deals with the alteration of the Memorandum of Association.","page":4,"originalNumber":8,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to alter its Memorandum of Association. What is required according to the Companies Act, 1994?","options":["A simple majority vote at a general meeting.","A special resolution passed by the shareholders.","Approval from the Registrar.","Consent from all directors."],"answer":1,"explanation":"Alteration of the Memorandum of Association requires a special resolution passed by the shareholders according to the Companies Act, 1994.","page":62,"originalNumber":6,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the maximum rate of discount at which shares can be issued according to the Companies Act, 1994?","options":["5%","10%","15%","20%"],"answer":1,"explanation":"Shares can be issued at a discount not exceeding ten percent.","page":4,"originalNumber":9,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company has issued debentures. What must the company do according to the Companies Act, 1994?","options":["The company must register the debentures with the Registrar.","The company must notify the shareholders.","The company must issue a public notice.","The company must obtain approval from the Court."],"answer":0,"explanation":"The Companies Act, 1994 requires the company to register the debentures with the Registrar.","page":62,"originalNumber":7,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"Under the Companies Act, 1994, what is the minimum subscription required before a company can commence business?","options":["25% of the nominal value of shares","50% of the nominal value of shares","75% of the nominal value of shares","100% of the nominal value of shares Busine s s Laws – "],"answer":3,"explanation":"A company must have allotted shares to an amount not less than the minimum subscription before commencing business.","page":4,"originalNumber":10,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to reduce its share capital. What steps must be taken according to the Companies Act, 1994?","options":["The company can reduce its share capital without any restrictions.","The reduction must be authorized by a special resolution and confirmed by the Court.","The company must notify the Registrar but does not need Court confirmation.","The company must obtain approval from the shareholders only."],"answer":1,"explanation":"The Companies Act, 1994 requires that any reduction in share capital must be authorized by a special resolution and confirmed by the Court.","page":62,"originalNumber":8,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the penalty for a company that commences business without meeting the minimum subscription requirement?","options":["Fine not exceeding 500 taka per day","Fine not exceeding 1,000 taka per day","Fine not exceeding 2,000 taka per day","Fine not exceeding 5,000 taka per day"],"answer":1,"explanation":"The penalty for contravening the minimum subscription requirement is a fine not exceeding 1,000 taka per day.","page":5,"originalNumber":11,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company has failed to file its annual return. What are the consequences according to the Companies Act, 1994?","options":["The company can continue operating without any issues.","The company can be fined for each day the default continues.","The company must file the return within the next year.","The company can be dissolved immediately."],"answer":1,"explanation":"The Companies Act, 1994 imposes a fine for each day the company fails to file its annual return.","page":62,"originalNumber":9,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the purpose of the statutory report?","options":["To provide details of the company's financial status","To outline the company's internal management","To report on the company's compliance with statutory requirements","To list the company's employees"],"answer":2,"explanation":"The statutory report provides details on the company's compliance with statutory requirements.","page":5,"originalNumber":12,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A director of a company is found guilty of fraud. What action can be taken according to the Companies Act, 1994?","options":["The director can continue in his position.","The director must repay any losses but can remain in his position. Busine s s Laws – ","The director can be removed from his position and prosecuted.","The director can be fined but not removed."],"answer":2,"explanation":"The Companies Act, 1994 allows for the removal and prosecution of a director found guilty of fraud.","page":62,"originalNumber":10,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"How often must a company hold an annual general meeting (AGM)?","options":["Every six months","Every year","Every two years","Every three years"],"answer":1,"explanation":"A company must hold an AGM every year.","page":5,"originalNumber":13,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to convert from a private company to a public company. What must it do according to the Companies Act, 1994?","options":["The company must increase its number of members to at least 50.","The company must alter its Articles of Association and file a prospectus or statement in lieu of prospectus.","The company must obtain approval from the Registrar.","The company must n otify all its creditors."],"answer":1,"explanation":"To convert from a private company to a public company, the company must alter its Articles of Association and file a prospectus or statement in lieu of prospectus according to the Companies Act, 1994.","page":63,"originalNumber":11,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the maximum period allowed between two AGMs?","options":["12 months","15 months","18 months","24 months"],"answer":1,"explanation":"The maximum period allowed between two AGMs is fifteen months.","page":5,"originalNumber":14,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Who is responsible for maintaining the register of members?","options":["The company's directors","The company's secretary","The company's auditor","The company's shareholders Busine s s Laws – "],"answer":1,"explanation":"The company's secretary is responsible for maintaining the register of members.","page":5,"originalNumber":15,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company has not commenced its business within a year of incorporation. What can be done according to the Companies Act, 1994?","options":["The company can continue without any issues.","The company must pay a fine.","The company can be wound up by the Court.","The company must notify the Registrar and seek an extension."],"answer":2,"explanation":"If a company does not commence its business within a year of incorporation, it can be wound up by the Court according to the Companies Act, 1994.","page":63,"originalNumber":12,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the minimum number of directors required for a public company?","options":["1","2","3","5"],"answer":2,"explanation":"A public company must have at least three directors.","page":6,"originalNumber":16,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to issue redeemable preference shares. What conditions must be met according to the Companies Act, 1994?","options":["The shares can be redeemed at any time without restrictions.","The shares must be fully paid and redeemed out of profits or fresh issue of shares.","The company must obtain approval from the Registrar.","The shares can be redeemed only with the conse nt of all shareholders."],"answer":1,"explanation":"The Companies Act, 1994 requires that redeemable preference shares must be fully paid and redeemed out of profits or fresh issue of shares.","page":63,"originalNumber":13,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the minimum number of directors required for a private company?","options":["1","2","3","5"],"answer":1,"explanation":"A private company must have at least two directors.","page":6,"originalNumber":17,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to amalgamate with another company. What steps must be taken according to the Companies Act, 1994?","options":["The company can amalgamate without any restrictions.","The amalgamation must be approved by a special resolution and sanctioned by the Court. Busine s s Laws – ","The company must notify the Registrar but does not need Court approval.","The company must obtain approval from the shareholders only."],"answer":1,"explanation":"The Companies Act, 1994 requires that any amalgamation must be approved by a special resolution and sanctioned by the Court.","page":63,"originalNumber":14,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"Under the Companies Act, 1994, who can be appointed as an auditor of a company?","options":["Any person","A person who is a member of the company","A person who is a director of the company","A person who is a chartered accountant"],"answer":3,"explanation":"Only a chartered accountant can be appointed as an auditor of a company.","page":6,"originalNumber":18,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company has issued shares to the public. What must the company do according to the Companies Act, 1994?","options":["The company must register the shares with the Registrar.","The company must notify the shareholders.","The company must issue a public notice.","The company must obtain approval from the Court."],"answer":0,"explanation":"The Companies Act, 1994 requires the company to register the shares with the Registrar.","page":64,"originalNumber":15,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the term of office for an auditor appointed at an AGM?","options":["Until the next AGM","Two years","Three years","Five years"],"answer":0,"explanation":"An auditor appointed at an AGM holds office until the next AGM.","page":6,"originalNumber":19,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to appoint a new auditor. What is required according to the Companies Act, 1994?","options":["The company can appoint any person as an auditor.","The company must appoint a chartered accountant as an auditor.","The company must obtain approval from the Registrar.","The company must notify the shareholders."],"answer":1,"explanation":"The Companies Act, 1994 requires that only a chartered accountant can be appointed as an auditor of a company.","page":64,"originalNumber":16,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the penalty for a company that fails to file its annual return?","options":["Fine not exceeding 500 taka","Fine not exceeding 1,000 taka","Fine not exceeding 2,000 taka","Fine not exceeding 5,000 taka"],"answer":1,"explanation":"The penalty for failing to file the annual return is a fine not exceeding 1,000 taka.","page":6,"originalNumber":20,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to increase its share capital. What steps must be taken according to the Companies Act, 1994?","options":["The company can increase its share capital without any restrictions.","The increase must be authorized by a special resolution.","The company must obtain approval from the Registrar.","The company must notify all its creditors."],"answer":1,"explanation":"The Companies Act, 1994 requires that any increase in share capital must be authorized by a special resolution.","page":64,"originalNumber":17,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the purpose of the Articles of Association? Busine s s Laws – ","options":["To define the company's relationship with the outside world","To outline the internal management of the company","To provide details of the company's financial status","To list the company's employees"],"answer":1,"explanation":"The Articles of Association contain the regulations for the internal management of the company.","page":6,"originalNumber":21,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"What is the maximum number of directors allowed in a private company?","options":["5","10","15","No limit"],"answer":3,"explanation":"There is no maximum limit on the number of directors in a private company.","page":7,"originalNumber":22,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company has been found guilty of conducting business fraudulently. What action can be taken according to the Companies Act, 1994?","options":["The company can continue operating without any issues.","The company must pay a fine but can continue operating.","The company can be wound up by the Court.","The company must notify the Registrar and seek an extension. Busine s s Laws – "],"answer":2,"explanation":"If a company is found guilty of conducting business fraudulently, it can be wound up by the Court according to the Companies Act, 1994.","page":64,"originalNumber":18,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"Under the Companies Act, 1994, what is the minimum age for a director?","options":["18 years","21 years","25 years","30 years"],"answer":0,"explanation":"The minimum age for a director is 18 years.","page":7,"originalNumber":23,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to issue bonus shares to its shareholders. What conditions must be met according to the Companies Act, 1994?","options":["The company can issue bonus shares without any restrictions.","The issue must be authorized by a special resolution.","The company must obtain approval from the Registrar.","The company must notify all its creditors."],"answer":1,"explanation":"The Companies Act, 1994 requires that the issue of bonus shares must be authorized by a special resolution.","page":65,"originalNumber":19,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the penalty for a director who fails to disclose his interest in a contract with the company?","options":["Fine not exceeding 500 taka","Fine not exceeding 1,000 taka","Fine not exceeding 2,000 taka","Fine not exceeding 5,000 taka"],"answer":3,"explanation":"The penalty for failing to disclose interest in a contract is a fine not exceeding 5,000 taka.","page":7,"originalNumber":24,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to change its registered office to another city. What steps must be taken according to the Companies Act, 1994?","options":["The company can change its registered office without any restrictions.","The change must be authorized by a special resolution and notified to the Registrar.","The company must obtain approval from the Court.","The company must notify all its credito rs."],"answer":1,"explanation":"The Companies Act, 1994 requires that any change in the registered office must be authorized by a special resolution and notified to the Registrar.","page":65,"originalNumber":20,"scenario":true,"topic":"Overview of Companies Act, 1994"},{"question":"What is the maximum period for which a managing director can be appointed?","options":["3 years","5 years","7 years","10 years"],"answer":1,"explanation":"A managing director can be appointed for a maximum period of five years. Busine s s Laws – ","page":7,"originalNumber":25,"scenario":false,"topic":"Overview of Companies Act, 1994"},{"question":"Scenario: A company wants to appoint an alternate director. What conditions must be met according to the Comp :131,"originalNumber":1,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner A frequently takes money from the partnership business for personal use without consulting Partner B. After some time, Partner B discovers the missing funds and wants to expel Partner A from the partnership. Question: What should Partner B consider before proceeding with expulsion?","options":["Whether he can unilaterally decide to expel Partner A","The terms specified in the partnership deed","The opinion of a third party","His personal feelings about Partner A"],"answer":1,"explanation":"Expulsion must be done according to the terms laid out in the partnership deed.","page":140,"originalNumber":1,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which of the following is NOT a form of partnership as per the Act?","options":["General Partnership","Limited Partnership","Joint Venture","Sleeping Partner"],"answer":2,"explanation":"A joint venture is a separate business arrangement and not classified under the Partnership Act.","page":131,"originalNumber":2,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partners C, D, and E formed a partnership to run a bakery. After two years, Partner C wants to leave the partnership due to personal reasons, but Partners D and E want him to stay. Question: What is the legal standing of Partner C wanting to leave?","options":["Partner C can leave unilaterally","Partner C can leave only if it aligns with the partnership deed","Partners D and E can force Partner C to stay Busine s s Laws – ","Partner C must buy out Partners D and E"],"answer":1,"explanation":"The rights and obligations regarding withdrawal should be governed by the partnership deed.","page":140,"originalNumber":2,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What is the minimum number of partners required to form a legal partnership?","options":["One","Two","Three","Four"],"answer":1,"explanation":"A partnership requires at least two persons to share profits.","page":131,"originalNumber":3,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner F dies suddenly. The partnership deed states that the partnership will continue in case of death. Question: What should the remaining partners do next?","options":["Automatically operate under the same terms","Draft a new partnership deed","Liquidate the partnership assets","Inform the deceased's estate about profits"],"answer":1,"explanation":"Even though the partnership continues, it’s prudent to draft a new deed reflecting any necessary changes.","page":141,"originalNumber":3,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which section of the Partnership Act, 1932 defines 'partnership'?","options":["Section 4","Section 7","Section 12","Section 11"],"answer":0,"explanation":"Section 4 of the Partnership Act explicitly defines a partnership as a relation between persons carrying on business together with shared profits. Busine s s Laws – ","page":131,"originalNumber":4,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partners G and H are running a consultancy firm. Partner G decides to add a new partner, Partner I, without consulting Partner H. Question: What is the legal consequence of this action?","options":["Partner G can add Partner I without consequences","Partner H can challenge the addition of Partner I","The partnership is automatically dissolved","Partner I will have no voting rights"],"answer":1,"explanation":"Adding a new partner typically requires unanimous consent from all existing partners unless otherwise stated in the partnership deed.","page":141,"originalNumber":4,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which of the following is a key feature of a partnership?","options":["Limited liability","Mutual agency","Legal personality","Government regulation"],"answer":1,"explanation":"In a partnership, each partner acts as an agent for the others within the scope of the partnership's business.","page":132,"originalNumber":5,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner J invested more capital than Partner K but both agreed to share profits equally. Partner K feels this is unfair. Question: What should Partner K refer to in this situation?","options":["General partnership principles","The partnership deed","Outside legal counsel","The opinion of other partners"],"answer":1,"explanation":"The partnership deed should specify the profit - sharing ratio and address any concerns regarding fairness. Busine s s Laws – ","page":141,"originalNumber":5,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What is the maximum number of partners allowed in a partnership engaged in non - banking activities?","options":["10","20","50","100"],"answer":1,"explanation":"A partnership can have up to 20 partners for non - banking businesses as per the Companies Act and other regulations.","page":132,"originalNumber":6,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner L wants to take a loan in the name of the partnership without consulting the other partners. Question: What is likely to happen if Partner L goes ahead with the loan?","options":["Partner L is solely responsible for repayment","The partnership can be held liable for the loan","The loan will not be sanctioned","All partners must sign the agreement"],"answer":1,"explanation":"If the loan is taken for partnership purposes, the partnership will generally be liable for repayment.","page":142,"originalNumber":6,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which document is essential to outline the terms and conditions of a partnership?","options":["Partnership Act","Partnership Deed","Memorandum of Association","Articles of Association"],"answer":1,"explanation":"A partnership deed is a written document that details the rights, duties, and obligations of partners.","page":132,"originalNumber":7,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: After a dispute arises, Partner M wants to dissolve the partnership but is unsure about the process. Question: What should Partner M check first?","options":["The business's current financial standing","The partnership deed for dissolution provisions","How to distribute assets","The opinions of non - partners"],"answer":1,"explanation":"The procedure for dissolution should be outlined in the partnership deed.","page":142,"originalNumber":7,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What is ‘partnership property’?","options":["Property owned by individual partners","Property used for personal use by partners","Property acquired by partners for partnership use","Any property leased by the partnership"],"answer":2,"explanation":"Partnership property is defined as assets acquired for the purpose of partnership business, whether owned or leased.","page":132,"originalNumber":8,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner N has been a passive investor in the partnership for years and wants to claim a salary for his contributions. Question: Is Partner N entitled to a salary?","options":["Yes, because he is a partner","No, unless stipulated in the partnership deed","Yes, if he demands it","No, because he is a sleeping partner"],"answer":1,"explanation":"Partners typically do not receive salaries unless specifically provided for in the partnership agreement.","page":142,"originalNumber":8,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What happens to a partnership if one partner dies? Busine s s Laws – ","options":["The partnership automatically dissolves","The remaining partners can continue the business","It becomes a limited liability partnership","It is transferred to the deceased's family"],"answer":1,"explanation":"A partnership can continue unless stated otherwise in the partnership agreement (deed).","page":132,"originalNumber":9,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Two partners, O and P, have operated for several years without a formal partnership deed. They now have a dispute regarding profit - sharing. Question: What legal principle applies in this situation?","options":["There are no protections under law for such a partnership","The default provisions of the Partnership Act will apply Busine s s Laws – ","They are liable for penalties","They must draft a retrospective deed"],"answer":1,"explanation":"In the absence of a partnership deed, default statutory provisions govern the relationship.","page":142,"originalNumber":9,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which provision must a partnership comply with to be legally recognized?","options":["Registration with the Registrar of Companies","Registration with local authorities","No formal registration is required","Filing annual returns"],"answer":2,"explanation":"While registration is recommended, a partnership can exist and be valid without formal registration.","page":133,"originalNumber":10,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partners Q and R decided to dissolve their partnership but have remaining assets and debts to settle. Question: How should they proceed with the dissolution?","options":["Distribute the assets equally before paying off debts","First settle all debts, then distribute any remaining assets","Liquidate assets immediately and share the proceeds","End the partnership with no further actions"],"answer":1,"explanation":"The dissolution process requires settling debts before any assets are distributed among the partners.","page":143,"originalNumber":10,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"In a partnership, what is the liability of a partner?","options":["Limited to their capital contribution","Joint and several liability","No liability","Only for debts incurred by them"],"answer":1,"explanation":"Each partner is jointly and individually liable for the debts of the partnership.","page":133,"originalNumber":11,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partners S and T are running a restaurant. Partner S incured significant debt on behalf of the partnership without consulting Partner T. Question: Who is liable for the debt?","options":["Only Partner S","Only Partner T","Both partners","The partnership itself, but not the individual partners"],"answer":2,"explanation":"All partners are jointly liable for debts incurred in the ordinary course of business.","page":143,"originalNumber":11,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"If a partner acts beyond their authority, how is the partnership affected?","options":["The action is binding on the partnership","The partnership is exempt from liability","The partner is personally liable","The act is valid, but not obligatory"],"answer":2,"explanation":"Partners can be held personally liable if they act beyond the authority given in the partnership deed.","page":133,"originalNumber":12,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner U wants to retire from a partnership which has not specified a withdrawal clause in their deed. Question: Can Partner U leave the partnership unilaterally?","options":["Yes, without any notice","No, he must follow the process in the Partnership Act","Yes, if most partners agree","No, he must buy out the other partners first"],"answer":1,"explanation":"Even without a specific clause, Partner U must still follow legal procedures stipulated in the Partnership Act for retirement.","page":143,"originalNumber":12,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"How can a partnership be dissolved?","options":["By mutual consent","By a court order Busine s s Laws – ","By operation of law","All of the above"],"answer":3,"explanation":"A partnership can be dissolved by mutual agreement, court order requests, or by statutory provisions.","page":133,"originalNumber":13,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner V dies, and there are no provisions regarding continuation in the partnership deed. Busine s s Laws –  Question: What will happen to the partnership?","options":["It continues with remaining partners","It is automatically dissolved","Only the business continues","The deceased partner’s family takes over"],"answer":1,"explanation":"In the absence of provisions allowing continuation, death usually leads to dissolution.","page":143,"originalNumber":13,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which of the following is a type of partner?","options":["Active partner","Sleeping partner","Nominal partner","All of the above"],"answer":3,"explanation":"Various types of partners exist within a partnership structure, including active, sleeping, and nominal partners.","page":134,"originalNumber":14,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partners W and X disagree on the business direction, leading to a complete standstill in operations. Question: What can they do to resolve their issues?","options":["One partner can force a decision","They can seek mediation or dissolve the partnership","They must continue until one partner gives up","They can go to court without consultation"],"answer":1,"explanation":"Mediation is a recommended method, and dissolution is an option when partners cannot agree.","page":144,"originalNumber":14,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What is a ‘sleeping partner’?","options":["A partner who is inactive in business","A partner who handles marketing","A partner who makes all decisions","A partner who works part - time"],"answer":0,"explanation":"A sleeping partner contributes capital but does not participate in day - to - day management.","page":134,"originalNumber":15,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner Y has been using partnership funds for personal expenses without informing Partner Z. Question: What can Partner Z do?","options":["Nothing, as all partners share profits","Confront Partner Y and settle within the partnership","Report Partner Y to external authorities","Demand a salary for losses incurred"],"answer":1,"explanation":"Internal resolution and possibly formal proceedings based on the partnership deed are appropriate first steps.","page":144,"originalNumber":15,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"In a partnership, if profits are not specified, how are they typically shared?","options":["Equally among partners","Based on capital contribution","As per the majority decision","Not shared at all"],"answer":0,"explanation":"In the absence of specific agreements, profits are generally shared equally among partners.","page":134,"originalNumber":16,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partners A, B, and C are involved in a startup, but Partner A is not contributing equally. Question: Can Partners B and C enforce equal contributions?","options":["Yes, partnerships require equal contributions","Only if specified in the partnership deed","No, partners are free to contribute as they please","Yes, they can bring this up in court"],"answer":1,"explanation":"The partnership deed should outline contributions and obligations.","page":144,"originalNumber":16,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What is the effect of registration of a partnership firm?","options":["It has no effect on the firm","It allows the firm to borrow money","It protects the partners' personal assets","It provides legal recognition and enforceability of rights Busine s s Laws – "],"answer":3,"explanation":"Registration helps in legitimatizing the firm and protects it under law.","page":134,"originalNumber":17,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner D invests in real estate through the partnership without seeking consent from Partner E. Question: What is the consequence of Partner D's action?","options":["Only Partner D is liable for the investment","The investment is invalid Busine s s Laws – ","The partnership is liable, but Partner E can object","Both partners benefit, regardless of prior consent"],"answer":2,"explanation":"The partnership may be bound by the investment, but Partner E can contest if it was unauthorized.","page":144,"originalNumber":17,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which is the correct order in which a partnership is dissolved?","options":["Settlement of debts, winding up, asset distribution","Asset distribution, winding up, settlement of debts","Winding up, asset distribution, settlement of debts","Winding up, settlement of debts, asset distribution"],"answer":3,"explanation":"Winding up occurs first, followed by settling outstanding debts, and then distributing remaining assets.","page":135,"originalNumber":18,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partners F and G face continual losses making them consider dissolving their partnership. Question: What must they do legally to dissolve the partnership?","options":["Write an informal agreement","Inform their clients and stop operating","Follow steps outlined in the partnership deed or the Partnership Act","File for bankruptcy immediately"],"answer":2,"explanation":"Proper procedures must be followed to ensure legal compliance.","page":145,"originalNumber":18,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which of the following describes a partnership's ‘relations to third parties’?","options":["Partners' personal responsibilities","Liability for partners' acts","Their rights as employees","Their standing in court"],"answer":1,"explanation":"Partnerships are liable for actions taken by one partner in the course of partnership business, affecting third parties directly.","page":135,"originalNumber":19,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner H introduces new technology that significantly improves profits, leading Partner I to demand higher dividends. Question: Can Partner I demand a larger share of the profits based on this?","options":["Yes, because of improved profits","No, profit - sharing ratios are determined by the partnership deed","Yes, if approved by external auditors","No, unless all partners agree"],"answer":1,"explanation":"Changes to profit - sharing must follow existing agreements.","page":145,"originalNumber":19,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"An important feature of partnership is shared 'profits'. What about losses?","options":["Only active partners bear losses","Losses are shared equally, unless stated otherwise","Losses are not shared","Sleeping partners do not share losses"],"answer":1,"explanation":"Unless specified in the deed, losses follow the same sharing as profits.","page":135,"originalNumber":20,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner J decides to change the business name without telling Partner K. Question: Is this action valid?","options":["Yes, any partner can change the name without consent","No, all partners must agree to changes in the business name","Yes, if it benefits the business","No, it violates statutory regulations"],"answer":1,"explanation":"Changes must be agreed upon by all partners to maintain trust and legal validity.","page":145,"originalNumber":20,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What happens if a partner is declared insolvent?","options":["The partnership is dissolved automatically","The remaining partners must pay the insolvent partner’s debts","The insolvent partner's share is liquidated","The partnership continues without changes"],"answer":2,"explanation":"The insolvent partner's share may be sold off to pay debts, but the partnership may continue if possible.","page":135,"originalNumber":21,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner L dies and has specified in the partnership deed that his share should go to a third party. Question: What happens next?","options":["The partnership is automatically dissolved","The third party automatically takes L’s place Busine s s Laws – ","The remaining partners can refuse the third party","The partnership must re - evaluate before proceeding"],"answer":1,"explanation":"As specified in the partnership deed, the share is entitled to the designated third party.","page":145,"originalNumber":21,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"If the rights of partners are not defined in the deed, what happens? Busine s s Laws – ","options":["Default provisions of law apply","Partners lose their rights","Rights are assumed by the majority","All partners lose equal rights"],"answer":0,"explanation":"In the absence of specific terms in the deed, the default provisions of the Partnership Act will govern.","page":135,"originalNumber":22,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner M wants to start a competing business and plans to use intellectual property from their partnership. Question: Is this permissible under the Partnership Act?","options":["Yes, because M is a partner","No, it constitutes a conflict of interest","Yes, if M believes it will not hurt the partnership","No, unless Partner N agrees"],"answer":1,"explanation":"Partners have a fiduciary duty not to compete against the partnership.","page":146,"originalNumber":22,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"A partnership has a written deed. Which of these statements would be incorrect?","options":["The deed supersedes common law","The deed must be registered","Terms can only be changed by all partners","A copy of the deed must be kept by each partner"],"answer":1,"explanation":"While registering the deed is recommended, it is not mandatory for the validity of partnership.","page":136,"originalNumber":23,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: In a partnership, expenses were incurred without proper documentation. Partner N wants to reimburse them. Question: Can Partner N reclaim those expenses?","options":["Yes, all expenses are reimbursable","No, only documented expenses","Yes, if agreed upon by all","No, partners cannot reclaim any expenses"],"answer":1,"explanation":"Expenses must typically be supported by documentation for reimbursement.","page":146,"originalNumber":23,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"A partner manages the business day - to - day but does not get a salary. What type of partner is this?","options":["Sleeping Partner","Limited Partner","Working Partner","Secret Partner"],"answer":2,"explanation":"A working partner actively participates in managing the business but may not receive a salary.","page":136,"originalNumber":24,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partners O and P agree to go public with their company. However, Partner O is suddenly opposed to the decision. Question: What happens if they cannot reach an agreement?","options":["They must continue without O","They should resolve the disagreement through mediation or dissolution","Partner O can block the public offering alone","They must continue to negotiate indefinitely"],"answer":1,"explanation":"Mediation is often advisable to resolve disputes, or they may consider dissolution as an option.","page":146,"originalNumber":24,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What principle governs the dissolution of a partnership?","options":["All partners must agree","A mutual decision","A statutory provision or decree","All of the above"],"answer":3,"explanation":"Partnerships can be dissolved through various means, including mutual consent, statutory provisions, or a decree.","page":136,"originalNumber":25,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner Q has been mismanaging funds, leading to large losses. Partner R wants to take legal action against Partner Q. Question: What legal grounds exist for action?","options":["Breach of fiduciary duty","Violation of corporate laws","No legal action can be taken against partners Busine s s Laws – ","Violation of profit - sharing rules"],"answer":0,"explanation":"Partners owe duties to act in the best interest of the partnership and can be held accountable for breaching this duty.","page":146,"originalNumber":25,"scenario":true,"topic":"The Partnership Act, 1932"}]},{"title":"Model Test 02","questions":[{"question":"How can partners change the terms of their partnership?","options":["By oral consent only Busine s s Laws – ","Through mutual written agreement","Only with a court order","By majority vote"],"answer":1,"explanation":"Changes must be documented in writing, ideally in the partnership deed.","page":136,"originalNumber":26,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: A partnership deed specifies that all partners must contribute equal capital. Partner S invests more than the others. Question: What can other partners do?","options":["Take legal action to recover their contribution","Amend the partnership deed for fairness","Nothing, as contributions are clearly defined","Ignore it as it does not affect profits"],"answer":0,"explanation":"If capital contributions are not equal as per the agreement, legal action might be necessary for breach.","page":147,"originalNumber":26,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which of the following is NOT a reason for dissolution of a partnership?","options":["Expiry of a fixed term","A court order due to impossibility of performance","When one partner decides to continue alone","Mutual consent among partners"],"answer":2,"explanation":"Simply deciding to continue does not invalidate the partnership; specific conditions are needed for dissolution.","page":137,"originalNumber":27,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partners T and U decide to terminate their partnership but have outstanding debts. Question: What is the proper order of actions they should take?","options":["Distribute remaining assets then pay debts","First settle debts then distribute remaining assets","Immediately stop all operations","Liquidate all assets without regard for debts"],"answer":1,"explanation":"The correct procedure is to address debts before any distribution.","page":147,"originalNumber":27,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Can the property owned by a partner be considered partnership property?","options":["Yes, if used in the partnership","No, it is personal property only","Only if it’s agreed in the deed","Only during the partnership duration"],"answer":0,"explanation":"If the property is used for partnership activities, it can be classified as partnership property.","page":137,"originalNumber":28,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner V discovers that Partner W has entered a transaction without seeking approval from the partners. Question: What can Partner V legally pursue?","options":["Nothing, because all partners share all decisions","Challenge the validity of the transaction","Seek to have Partner W expelled","Inform clients and dissolve the partnership"],"answer":1,"explanation":"Partner V can contest any transaction that does not comply with partnership rules.","page":147,"originalNumber":28,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Under what scenario can a partner be held liable for the wrongful acts of another partner?","options":["If the act is done in the ordinary course of business","If the act is illegal","When third parties are involved","All of the above"],"answer":0,"explanation":"Partners are liable for acts done within the scope of partnership business.","page":137,"originalNumber":29,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner X wants to conduct business under another name without notifying Partner Y. Question: Is Partner Y bound by Partner X’s actions?","options":["Yes, as long as the business is the same","No, because consent was not obtained","Yes, but only if it benefits the partnership","No, the name change requires mutual approval Busine s s Laws – "],"answer":3,"explanation":"Partners must collectively agree on business names to maintain trust and legal standing.","page":147,"originalNumber":29,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What protects the rights of partners from being violated?","options":["The partnership’s goodwill","The Partnership Act and Deed","The personal assets of each partner","Legal insurance Busine s s Laws – "],"answer":1,"explanation":"The legally binding agreement and the Act provide statutory protections of partners’ rights.","page":137,"originalNumber":30,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: The partnership deed states that any partner can withdraw funds for personal use without prior consent; however, one partner abuses this privilege. Question: What recourse do remaining partners have?","options":["Nothing because it’s in the deed","Mediation or reforming the deed","Expulsion without cause","Sue the partner for damages"],"answer":1,"explanation":"Remaining partners can seek amendments to the deed to limit withdrawals if a partner abuses their power.","page":148,"originalNumber":30,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What is the result if a partner acts outside their authority?","options":["The firm is liable","The partner alone is liable","No liability exists","It depends on the act's nature"],"answer":0,"explanation":"Generally, the firm is liable for acts done within the scope of business, even if a partner exceeds authority.","page":138,"originalNumber":31,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner Z wants to introduce a new partner to the business but there is a disagreement from Partner Y. Question: What is required to add a new partner?","options":["A simple majority consent","Unanimous agreement among all partners","No consent is required","Approval from external sources"],"answer":1,"explanation":"All existing partners must agree to the addition of a new partner unless the deed specifies otherwise.","page":148,"originalNumber":31,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which partner bears the risk of insolvency?","options":["Active partners only","No specific partner","All partners equally","The financial partner"],"answer":2,"explanation":"All partners share the risk of insolvency equally under the law.","page":138,"originalNumber":32,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner A is involved in illegal activities using partnership assets. Partner B discovers this. Question: What should Partner B do first?","options":["Ignore it as it's their partner's decision","Inform authorities immediately","Seek legal advice and discuss with Partner A","Confront Partner A and demand a stop"],"answer":2,"explanation":"Seeking legal advice is crucial in determining the most appropriate course of action regarding illegal activities.","page":148,"originalNumber":32,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What is the legal status of a partnership during dissolution?","options":["It still exists","It is entirely dissolved","It operates under a new name","No change occurs"],"answer":1,"explanation":"Once dissolved, the partnership ceases to exist until a new partnership is formed.","page":138,"originalNumber":33,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner C resigns from a group of partners due to dissatisfaction, but the deed includes penalties for any partner leaving early. Question: What follows in this situation?","options":["Partner C must pay the penalty as stipulated","Partner C can argue against the penalties","The partnership must dissolve immediately","Partners cannot charge penalties for resignation"],"answer":0,"explanation":"The deed’s provisions regarding resignation and any associated penalties must be adhered to. Busine s s Laws – ","page":148,"originalNumber":33,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which of the following is considered a ‘sleeping partner’?","options":["A partner who actively manages the firm","A partner who invests but does not participate in management","A partner who provides advice","A partner who is on sabbatical leave"],"answer":1,"explanation":"A sleeping partner invests capital but is not involved in day - to - day operations. Busine s s Laws – ","page":138,"originalNumber":34,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: During a financial audit, it is revealed that Partner D misrepresented finances to gain a larger share of profits. Question: What legal action can the other partners pursue?","options":["Nothing can be done","They could seek damages and removal of Partner D","They could publicly announce the misconduct","All partners must forfeit their shares"],"answer":1,"explanation":"Partners can pursue legal remedies against Partner D for misrepresentation and breach of fiduciary duty.","page":149,"originalNumber":34,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What does the term 'partnership at will' mean?","options":["Specific duration for the partnership","A partnership that can be terminated at any time","Partnership established for a particular project","No legal documentation is required"],"answer":1,"explanation":"A partnership at will can be dissolved voluntarily by any partner at any time.","page":139,"originalNumber":35,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partners G, H, and I have equal shares in the partnership but have not defined their roles formally in the partnership deed. Partner I begins making decisions on behalf of the partnership unilaterally. Question: What can Partners G and H do?","options":["Accept Partner I’s authority as the majority","Allow Partner I to proceed as long as there are profits","Challenge Partner I's decisions and request a meeting to discuss roles","Take no action, as decisions can be made by any partner"],"answer":2,"explanation":"In the absence of defined roles, all partners retain equal authority, and Partners G and H can challenge any unilateral actions taken by Partner I.","page":149,"originalNumber":35,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Under the Partnership Act, what is the fate of partnership property upon dissolution?","options":["Distributed based on ownership","Sold to pay off debts first","Kept for future use","Donated to charity"],"answer":1,"explanation":"Partnership property must first settle any outstanding debts.","page":139,"originalNumber":36,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner J wants to dissolve the partnership, but Partners K and L want to continue the business. The partnership deed does not have any clauses regarding dissolution. Question: What is the best course of action for the partners?","options":["Continue without Partner J and file for business registration","Dissolve the partnership as requested by Partner J","Seek mediation to negotiate continuation terms","Ignore Partner J's request and proceed"],"answer":2,"explanation":"Mediation can help the partners reach a consensus on whether to continue or dissolve the partnership given the lack of defined dissolution terms in the deed.","page":149,"originalNumber":36,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What must be included in a partnership deed generally?","options":["Only the names of partners","Rights and responsibilities of partners","Only profit - sharing ratios","The business address"],"answer":1,"explanation":"The partnership deed should comprehensively outline partners’ rights and duties.","page":139,"originalNumber":37,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner M incurs a large debt with a supplier to purchase materials without consulting the other partners. Question: What is the liability of the partners regarding this debt?","options":["Only Partner M is liable","Partners cannot be held liable because of lack of consent","All partners are liable as long as the purchase was within the business's purpose","The debt can be disregarded since it was unauthorized Busine s s Laws – "],"answer":2,"explanation":"All partners are generally liable for debts incurred in the regular course of business, even if they are unaware of the transaction.","page":149,"originalNumber":37,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Which of the following can be a general partner?","options":["An individual","A company","A partnership","All of the above"],"answer":3,"explanation":"Any legal entity can be a partner in a partnership firm.","page":139,"originalNumber":38,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner O wants to include a clause in the partnership deed allowing for profit sharing based on workload rather than capital invested. Other partners disagree. Question: What steps should Partner O take?","options":["Unilaterally change the deed","Seek consensus among partners to amend the partnership deed","Continue with current profit - sharing ratios","Submit the proposal to an external mediator"],"answer":1,"explanation":"Any modification to the partnership deed requires agreement from all partners, and it is essential to negotiate the change instead of acting unilaterally.","page":150,"originalNumber":38,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"What is partnership property?","options":["Property owned by partners individually Busine s s Laws – ","Property used exclusively for business","Property acquired for business purposes during the partnership","Any asset owned before the partnership"],"answer":2,"explanation":"Partnership property refers to assets acquired for the business, not individual properties.","page":139,"originalNumber":39,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: Partner P wishes to withdraw from the partnership and begin a similar business indirectly using knowledge gained from the partnership. Question: What restriction applies to Partner P under the Partnership Act?","options":["Partner P cannot start a similar business for 5 years","Partner P may do so as long as they notify the other partners","Partner P is prohibited from using the partnership's confidential information","Partner P can freely compete as a former partner"],"answer":2,"explanation":"Partners have a fiduciary duty not to use confidential information from the partnership to benefit personally or in competition.","page":150,"originalNumber":39,"scenario":true,"topic":"The Partnership Act, 1932"},{"question":"Under what circumstance can a partner be expelled from the partnership?","options":["By mutual agreement","By a simple majority","As per the partnership deed","By an external authority"],"answer":2,"explanation":"Expulsion must generally align with conditions spelled out in the partnership deed. Scenario - Based MCQs ( 4 0):","page":140,"originalNumber":40,"scenario":false,"topic":"The Partnership Act, 1932"},{"question":"Scenario: A disagreement arises regarding the partnership’s management between Partners Q and R, leading to a potential conflict. Question: What should Partners Q and R consider as their first step?","options":["Take their dispute to court","Engage in a discussion to resolve their differences","Suspend the partnership's operations","Impose penalties on each other"],"answer":1,"explanation":"Open communication is the preferred and most constructive way to resolve internal disputes before escalating them to legal action. Busine s s Laws –  4.1 The Contract Act, 1872 I've reviewed the content of the \"Contract Act, 1872\" document. Here are 40 general multiple - choice questions (MCQs) with answers and explanations based on the key concepts from the document: MCQs","page":150,"originalNumber":40,"scenario":true,"topic":"The Partnership Act, 1932"}]}]},{"title":"The Contract Act, 1872 and Sale of Goods Act, 1930","tests":[{"title":"Model Test 01","questions":[{"question":"What is the short title of the Act?","options":["The Contract Act, 1872","The Agreement Act, 1872","The Contractual Obligations Act, 1872","The Contractual Law, 1872"],"answer":0,"explanation":"The Act is officially titled \"The Contract Act, 1872.\"","page":151,"originalNumber":1,"scenario":false,"topic":"Contract Act, 1872"},{"question":"When did the Contract Act, 1872 come into force?","options":["1st January, 1872","1st April, 1872","1st September, 1872","1st December, 1872"],"answer":2,"explanation":"The Act came into force on the first day of September, 1872.","page":151,"originalNumber":2,"scenario":false,"topic":"Contract Act, 1872"},{"question":"Which of the following is NOT a type of contract defined in the Act?","options":["Voidable Contract","Valid Contract","Illegal Contract","Enforceable Contract"],"answer":3,"explanation":"The Act defines voidable, valid, and illegal contracts but does not specifically define \"enforceable contract.\"","page":151,"originalNumber":3,"scenario":false,"topic":"Contract Act, 1872"},{"question":"Scenario: A buyer agrees to purchase a specific car from a seller. Before the contract is made, the car is destroyed in a fire. What is the status of the contract?","options":["The contract is valid","The contract is void","The buyer must pay for the car","The seller must provide a replacement car"],"answer":1,"explanation":"If specific goods perish without the knowledge of the seller at the time the contract is made, the contract is void.","page":194,"originalNumber":1,"scenario":true,"topic":"Sale of Goods Act, 1930"},{"question":"What is a 'proposal' according to the Act?","options":["An offer to do or abstain from doing something","An acceptance of an offer","A mutual agreement Busine s s Laws – ","A legal obligation"],"answer":0,"explanation":"A proposal is when one person signifies to another his willingness to do or abstain from doing something.","page":151,"originalNumber":4,"scenario":false,"topic":"Contract Act, 1872"},{"question":"When does a proposal become a promise?","options":["When it is communicated","When it is accepted","When it is revoked","When it is rejected"],"answer":1,"explanation":"A proposal becomes a promise when it is accepted by the person to whom it is made.","page":152,"originalNumber":5,"scenario":false,"topic":"Contract Act, 1872"},{"question":"Who is a 'promisor'?","options":["The person making the proposal","The person accepting the proposal","The person revoking the proposal","The person rejecting the proposal"],"answer":0,"explanation":"The person making the proposal is called the promisor.","page":152,"originalNumber":6,"scenario":false,"topic":"Contract Act, 1872"},{"question":"Scenario: A seller agrees to sell 100 bags of rice to a buyer. The rice is to be delivered in two months. Before delivery, the rice is destroyed by a flood. What happens to the agreement?","options":["The agreement is valid","The agreement is void","The buyer must pay for the rice","The seller must provide replacement rice"],"answer":1,"explanation":"If specific goods perish before the sale but after the agreement to sell, the agreement is void.","page":194,"originalNumber":2,"scenario":true,"topic":"Sale of Goods Act, 1930"},{"question":"What is 'consideration' in a contract?","options":["The acceptance of a proposal","The revocation of a proposal","The act or abstinence or promise by the promisee","The rejection of a proposal"],"answer":2,"explanation":"Consideration is something done or abstained from doing by the promisee at the desire of the promisor.","page":152,"originalNumber":7,"scenario":false,"topic":"Contract Act, 1872"},{"question":"Which section of the Act deals with the communication of proposals?","options":["Section 2","Section 3","Section 4","Section 5 Busine s s Laws – "],"answer":1,"explanation":"Section 3 deals with the communication, acceptance, and revocation of proposals.","page":152,"originalNumber":8,"scenario":false,"topic":"Contract Act, 1872"},{"question":"Scenario: A buyer purchases a refrigerator from a seller. The refrigerator is delivered, but it does not work properly. What can the buyer do?","options":["Reject the refrigerator and demand a refund","Accept the refrigerator and claim damages","Both a and b","None of the above"],"answer":2,"explanation":"The buyer can reject the goods and demand a refund or accept the goods and claim damages for breach of warranty.","page":194,"originalNumber":3,"scenario":true,"topic":"Sale of Goods Act, 1930"},{"question":"When is the communication of a proposal complete?","options":["When it is sent","When it is received","When it is accepted","When it is revoked"],"answer":1,"explanation":"The communication of a proposal is complete when it comes to the knowledge of the person to whom it is made.","page":153,"originalNumber":9,"scenario":false,"topic":"Contract Act, 1872"},{"question":"What is a 'voidable contract'?","options":["A contract that is not enforceable by law","A contract that is enforceable by law at the option of one or more parties","A contract that is illegal","A contract that is valid"],"answer":1,"explanation":"A voidable contract is enforceable by law at the option of one or more parties but not at the option of the other or others.","page":153,"originalNumber":10,"scenario":false,"topic":"Contract Act, 1872"},{"question":"Which section defines 'free consent'?","options":["Section 10","Section 12","Section 14","Section 16"],"answer":2,"explanation":"Section 14 defines free consent.","page":153,"originalNumber":11,"scenario":false,"topic":"Contract Act, 1872"},{"question":"Scenario: A seller delivers 90 bags of wheat instead of the 100 bags agreed upon in the contract. What are the buyer's options?","options":["Accept the 90 bags and pay for them","Reject the 90 bags","Both a and b","None of the above"],"answer":2,"explanation":"The buyer can accept the 90 bags and pay for them at the contract rate or reject the 90 bags.","page":195,"originalNumber":4,"scenario":true,"topic":"Sale of Goods Act, 1930"},{"question":"What is 'coercion' as per the Act?","options":["The act of persuading someone to enter into a contract","The act of threatening someone to enter into a contract","The act of deceiving someone to enter into a contract","The act of misrepresenting facts to enter into a contract Busine s s Laws – "],"answer":1,"explanation":"Coercion is the committing or threatening to commit any act forbidden by the Penal Code with the intention of causing any person to enter into an agreement.","page":153,"originalNumber":12,"scenario":false,"topic":"Contract Act, 1872"},{"question":"Which section deals with 'undue influence'?","options":["Section 15","Section 16","Section 17","Section 18"],"answer":1,"explanation":"Section 16 defines undue influence.","page":154,"originalNumber":13,"scenario":false,"topic":"Contract Act, 1872"},{"question":"Scenario: A buyer orders 50 chairs from a seller. The seller delivers 60 chairs. What can the buyer do?","options":["Accept all 60 chairs and pay for them","Accept the 50 chairs and reject   test=t;
  state=reset?null:load(chapter,test);
  if(!state||!state.deadline)state={deadline:Date.now()+3600000,current:0,answers:{},marks:{},complete:false};
  if(Date.now()>=state.deadline)state.complete=true;
  store();state.complete?results():exam();
 }
 function clock(){
  if(!state)return;
  if(!state.complete&&Date.now()>=state.deadline){state.complete=true;store();results();return;}
  const node=document.getElementById("timer");
  if(node){
   const n=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));
   node.textContent=String(Math.floor(n/3600)).padStart(2,"0")+":"+String(Math.floor(n%3600/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
   node.classList.toggle("urgent",n<300);
  }
 }
 function answered(i){return Object.prototype.hasOwnProperty.call(state.answers,String(i));}
 function feedback(q,chosen){
  const correct=chosen===q.answer;
  return '<div class="feedback '+(correct?'good':'bad')+'"><strong>'+(correct?'Correct answer':'Incorrect answer')+'</strong><div>Correct option: <b>'+String.fromCharCode(65+q.answer)+') '+esc(q.options[q.answer])+'</b></div>'+(q.explanation?'<p><b>Explanation:</b> '+esc(q.explanation)+'</p>':'')+'<small>Source PDF page: '+q.page+'</small></div>';
 }
 function exam(){
  clock();if(state.complete)return results();
  const list=qs(),i=Math.max(0,Math.min(list.length-1,state.current));state.current=i;
  const q=list[i],chosen=state.answers[i],done=answered(i),correctCount=Object.keys(state.answers).length;
  root.innerHTML=header()+'<main class="layout"><div class="exam-head"><button id="back" class="quiet">← All model tests</button><div class="clock">Time remaining <strong id="timer">01:00:00</strong></div></div><div class="exam-title"><div><div class="eyebrow">'+esc(data.chapters[chapter].title)+' · Model Test '+(test+1)+'</div><h2>Question '+(i+1)+' of '+list.length+'</h2></div><div class="count">'+correctCount+' answered</div></div><div class="progress"><div style="width:'+(100*correctCount/list.length)+'%"></div></div><div class="exam-layout"><section class="questionbox"><div class="qmeta">'+(q.scenario?'Scenario-based MCQ':'Knowledge / application MCQ')+' · Source page '+q.page+'</div><div class="question">'+esc(q.question)+'</div><div class="options">'+q.options.map((o,k)=>'<button class="option '+(done?(k===q.answer?'right':k===chosen?'wrong':''):'' )+'" data-opt="'+k+'" '+(done?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+k)+'</span><span>'+esc(o)+'</span></button>').join("")+'</div>'+(done?feedback(q,chosen):'')+'<div class="qbottom"><button class="quiet" id="prev" '+(i===0?'disabled':'')+'>← Previous</button><button class="quiet" id="mark">'+(state.marks[i]?'Unmark review':'☆ Mark for review')+'</button><button class="primary" id="next">'+(i===list.length-1?'Review result':'Next →')+'</button></div></section><aside class="navigator"><h3>Question navigator</h3><p>Choose a question to jump to it.</p><div class="numbers">'+list.map((z,k)=>'<button class="number '+(k===i?'current ':'')+(answered(k)?'answered ':'')+(state.marks[k]?'marked':'')+'" data-q="'+k+'">'+(k+1)+'</button>').join("")+'</div><div class="legend">● Answered &nbsp; ☆ Marked for review</div><button class="finish" id="finish">Submit Test</button></aside></div></main>';
  root.querySelector("#back").onclick=home;
  root.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{if(!answered(i)&&!state.complete){state.answers[i]=Number(b.dataset.opt);store();exam();}});
  root.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{state.current=Number(b.dataset.q);store();exam();});
  root.querySelector("#prev").onclick=()=>{state.current=Math.max(0,i-1);store();exam();};
  root.querySelector("#mark").onclick=()=>{state.marks[i]=!state.marks[i];store();exam();};
  root.querySelector("#next").onclick=()=>{if(i===list.length-1){if(confirm("Submit this test and finish?"))finish();}else{state.current=i+1;store();exam();}};
  root.querySelector("#finish").onclick=()=>{if(confirm("Finish this test? Unanswered questions will remain unanswered."))finish();};
  clock();
 }
 function finish(){state.complete=true;store();results();}
 function results(){
  const list=qs();
  let correct=0;list.forEach((q,i)=>{if(state.answers[i]===q.answer)correct++;});
  const ans=Object.keys(state.answers).length;
  root.innerHTML=header()+'<main class="layout"><div class="intro"><div class="eyebrow">MODEL TEST '+(test+1)+' COMPLETED</div><h1>Test Results</h1><p>'+esc(data.chapters[chapter].title)+'</p></div><div class="stats"><div><b>'+correct+' / '+list.length+'</b><span>Correct</span></div><div><b>'+(ans-correct)+'</b><span>Incorrect</span></div><div><b>'+(list.length-ans)+'</b><span>Unanswered</span></div></div><div class="actions"><button class="primary" id="restart">Restart Test</button><button class="quiet" id="homeresult">All Model Tests</button></div><h2>Answer Review</h2><div class="reviews">'+list.map((q,i)=>'<div class="review"><div class="qmeta">Question '+(i+1)+' · PDF page '+q.page+'</div><strong>'+esc(q.question)+'</strong><p>Your answer: '+(answered(i)?esc(q.options[state.answers[i]]):'Not answered')+'</p><p>Correct: <b>'+esc(q.options[q.answer])+'</b></p>'+(q.explanation?'<p>'+esc(q.explanation)+'</p>':'')+'</div>').join("")+'</div></main>';
  root.querySelector("#restart").onclick=()=>{if(confirm("Start a fresh one-hour attempt?"))open(test,true);};
  root.querySelector("#homeresult").onclick=home;
 }
 window.setInterval(()=>{if(state&&!state.complete)clock();},1000);
 home();
})();</script></body></html>
